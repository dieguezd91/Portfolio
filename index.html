    <!--
      IMPECCABLE DIRECTION CONTRACT

      THESIS: A hiring engineer's dossier, not an arcade cabinet. The page argues
      with evidence — a shipped store release, screenshots, and spec tables —
      and refuses the category default this site used to be: a neon-HUD hero
      over a particle field with the work buried in a 3D coverflow.

      OWN-WORLD: Near-black warm-neutral ground (#0A0A0B), bone text, hairline
      rules at 10% white, and a single signal orange (#FF5C29) spent only on
      shipped status and primary actions. Archivo carries the voice — expanded
      widths for display, normal for text — with Martian Mono reserved for real
      metadata. The UI is achromatic on purpose so the game screenshots supply
      every other colour on the page.

      STORY: The visitor learns in one viewport that this is a Unity gameplay
      and systems developer with a game actually live on Google Play, reads
      three featured projects as spec-backed evidence, scans the rest of the
      catalogue, and leaves through a store link, the resume, or contact.
      Only confirmed responsibilities are ever presented as personal scope of
      work; unverified legacy copy stays out of the UI entirely.

      FIRST VIEWPORT: Asymmetric split. Left, a plain-language positioning
      headline at display scale, attributed underneath by a hairline and
      Daniel's name, then one supporting line on demonstrated project and
      platform range, then the "See the work" and "Résumé" actions. Right,
      the Slash 'em Out! release record — status, title, spec table and store
      link — so the proof sits beside the claim rather than three screens
      below it.

      FORM: Editorial + product case study, pinned by the user's brief. No
      concept roll was run: a brief-pinned direction beats the roll.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
